name: audit-canary

on:
  # a PR's audit fails only on what it adds, so canary's own advisories surface here, as one bump issue
  push:
    branches: ["canary"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit-canary:
    name: Audit canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Audit and keep the bump issue
        # the same level and ignore list as the Audit step in auto-check-build.yml
        run: bun packages/scripts/src/audit-canary.ts --audit-level moderate --ignore GHSA-67mh-4wv8-2f99 --ignore GHSA-g3hv-75wg-m249
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
