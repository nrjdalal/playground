name: auto-check-build

on:
  # no pull_request_review trigger: the result cannot change because someone reviewed, and a
  # second run on the same commit only cancels the first through the concurrency group below,
  # which surfaces on the PR as a cancelled check
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["canary", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-check-build:
    name: Lint and Build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --ignore-scripts

      # audit.ts tries again when npm's advisories endpoint hangs or answers 5xx, and fails only on an advisory this PR adds over its base
      - name: Audit
        # GHSA-vfj7-8cjw-p6xm: braces has no patched release, and only dev tooling (shadcn, globby) reaches it
        run: bun packages/scripts/src/audit.ts --audit-level high --ignore GHSA-vfj7-8cjw-p6xm --new-over origin/${{ github.base_ref }}

      - name: Format, Lint, Check-types, and Build
        run: |
          bun run format:check
          bun run lint
          # turbo's tasks for the packages this PR changes, their dependents and @packages/scripts (turbo.json's @packages/scripts#check-types says why), each from its cache when its inputs are unchanged
          bunx turbo run check-types build --filter='...[origin/${{ github.base_ref }}]' --filter=@packages/scripts
          # the root checks import packages/* and @api/hono through dist, and web/next's tests the generated data-table metrics, which a PR changing none of them leaves unmade on a clean checkout
          bunx turbo run build --filter='./packages/*' --filter=@api/hono
          bun packages/scripts/src/data-table-metrics.ts
          bun run check-types:tests
          bun packages/scripts/src/env-keys.ts
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

  # the suite's shards and the clock-ahead pass's jobs, by tests/timings.json with the last passing run's shard timings merged over it: test-shards.ts legs gives each as many as its budget needs
  shards:
    name: Shards
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # the newest passing run from a branch of this repo, since a fork's run could upload any timings; with no run or no shard timings, test-timings.ts keeps the committed file
      - name: Merge the last passing run's shard timings
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto-check-build.yml/runs?status=success&per_page=30" --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].id // empty") || true
          if [ -n "$run" ]; then gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'timings-*' --dir "$RUNNER_TEMP/timings" || echo "run $run kept no shard timings"; fi
          bun packages/scripts/src/test-timings.ts "$RUNNER_TEMP/timings"
        env:
          GH_TOKEN: ${{ github.token }}

      - id: plan
        run: echo "matrix=$(bun packages/scripts/src/test-shards.ts legs)" >> "$GITHUB_OUTPUT"

      # each shard splits by the same merged timings, so the shards' files add up to the suite once
      - name: Keep the split's timings
        uses: actions/upload-artifact@v7
        with:
          name: shard-plan
          path: tests/timings.json
          retention-days: 7

  suite:
    name: Suite (${{ matrix.shard }}${{ matrix.clock && ', clock ahead' || '' }})
    needs: shards
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # every real-clock shard, and beside them the clock-ahead pass (CLOCK_AHEAD_DAYS, test-sandbox.ts) split on its own, since it leaves out clock-exempt.ts's files, so a test that takes its clock from two sources goes red on its own PR, not on the day the real clock reaches it
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # the spawn gates' fake pane types its command into zsh, which ubuntu-latest lacks; apt's lookup fails now and then (exit 100), so it gets 3 tries
      - name: Install zsh
        run: |
          if command -v zsh >/dev/null; then echo "zsh is present at $(command -v zsh): no apt call"; exit 0; fi
          for try in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y -q zsh; then exit 0; fi
            echo "apt try $try of 3 failed"
            if [ "$try" -lt 3 ]; then sleep $((try * 15)); fi
          done
          exit 1

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --ignore-scripts

      # a test starts its container in a 60s beforeAll, and a fresh runner's pull inside it timed out (PG-1058); image-pull.test.ts holds this list to the images the tests start
      - name: Pull the test images
        run: |
          for image in postgres:18-alpine redis:alpine; do
            start=$(date +%s)
            docker pull -q "$image"
            echo "$image pulled in $(( $(date +%s) - start ))s"
          done

      - name: Take the split's timings
        uses: actions/download-artifact@v8
        with:
          name: shard-plan
          path: tests

      # what `bun run test` builds first, then this shard's files alone through the same sandbox, so its hang deadline holds in each shard
      - name: Test this shard
        run: |
          bunx turbo run build --filter='./packages/*' --filter=@api/hono
          bun packages/scripts/src/data-table-metrics.ts
          bun packages/scripts/src/test-shards.ts files ${{ matrix.shard }} > "$RUNNER_TEMP/shard-files"
          NODE_ENV=test xargs bun packages/scripts/src/test-sandbox.ts < "$RUNNER_TEMP/shard-files"
        env:
          CLOCK_AHEAD_DAYS: ${{ matrix.clock }}
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
          # the suite's parallel pass names the file it hangs in at its deadline, which lands well inside the job's 20 minutes
          TEST_PARALLEL_DEADLINE_MS: 600000
          # the real clock's parallel pass writes each file's time into tests/timings.json, which the next run's Shards job merges
          TEST_TIMINGS_UPDATE: ${{ !matrix.clock && '1' || '' }}

      - name: Gather this shard's timings
        if: ${{ !matrix.clock }}
        run: mkdir -p "$RUNNER_TEMP/timings" && cp tests/timings.json "$RUNNER_TEMP/shard-files" "$RUNNER_TEMP/timings/"

      - name: Keep this shard's timings
        if: ${{ !matrix.clock }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 7

  # the gate's check name (REQUIRED_CHECKS in pr-merge/gates.ts): one result, green only when the lint and build job and every shard, on both clocks, passed
  audit-lint-build:
    name: Audit, Lint, and Build
    needs: [auto-check-build, suite]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint and build: ${{ needs.auto-check-build.result }}, suite: ${{ needs.suite.result }}"
          [ "${{ needs.auto-check-build.result }}" = success ] && [ "${{ needs.suite.result }}" = success ]
