name: auto-test

on:
  # no pull_request_review trigger: the result cannot change because someone reviewed, and a
  # second run on the same commit only cancels the first through the concurrency group below,
  # which surfaces on the PR as a cancelled check
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["canary", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-test:
    name: test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install uv (runs every Python step under Python 3.13)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Bun (runs test:skills)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # test:skills' steps run zsh, which the hosted image may not carry
      - name: Install zsh
        uses: ./.github/actions/install-zsh

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: bun run test:skills (each step in the steps list of packages/scripts/src/test-skills.ts)
        run: bun run test:skills
