name: hosted-test

on:
  # once per PR at the merge gate, on a hosted runner, as hosted-check-build
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: ["canary", "main"]

jobs:
  hosted-test:
    name: test
    # a label other than Cloud CI added to a gated PR starts no second run
    if: contains(github.event.pull_request.labels.*.name, 'Cloud CI') && (github.event.action != 'labeled' || github.event.label.name == 'Cloud CI')
    runs-on: ubuntu-latest
    # in the job, not the workflow, so a skipped run never joins the group and cancels the gate run
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv (runs every Python step under Python 3.13)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Install Bun (runs test:skills)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # a head whose stamp already passed every check these jobs run, on it or past clean canary merges, runs nothing new; a read that fails runs everything
      - name: Read the stamp
        id: stamp
        run: bun packages/scripts/src/pr-merge/stamp-cli.ts carried ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT" || echo "green=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # test:skills' steps run zsh, which the hosted image may not carry
      - name: Install zsh
        if: steps.stamp.outputs.green != 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install dependencies (the lat check runs the locked lat-core from node_modules)
        if: steps.stamp.outputs.green != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: bun run test:skills (each step in the steps list of packages/scripts/src/test-skills.ts)
        if: steps.stamp.outputs.green != 'true'
        run: bun run test:skills
