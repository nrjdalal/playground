name: list-shape

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["canary"]

permissions:
  contents: read

jobs:
  shape:
    name: List shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the list secret's shape, counts only
        run: |
          node -e '
          const v = process.env.TRACE_TERMS ?? ""
          console.log("empty:", v.trim() === "")
          let parsed, json = false
          try { parsed = JSON.parse(v); json = true } catch {}
          console.log("json:", json)
          if (json && parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
            const keys = Object.keys(parsed)
            const known = ["companies", "handles", "linearKeys", "names", "slackIds"]
            console.log("keys total:", keys.length)
            console.log("known keys:", keys.filter((k) => known.includes(k)).length)
            console.log("known keys holding string arrays:", keys.filter((k) => known.includes(k) && Array.isArray(parsed[k]) && parsed[k].every((x) => typeof x === "string")).length)
          } else if (json) {
            console.log("json kind:", Array.isArray(parsed) ? "array" : typeof parsed)
          } else {
            console.log("lines:", v.split("\n").length)
          }
          '
        env:
          TRACE_TERMS: ${{ secrets.TRACE_TERMS }}
