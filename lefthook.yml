# Hooks run the committing worktree's own lefthook (git runs them from its root), not a removed installer's, and fail loudly without node_modules; bun runs it, as the npm wrapper wants node
lefthook: bun node_modules/.bin/lefthook

pre-commit:
  piped: true
  commands:
    main-checkout:
      # alone at priority 1, so it runs first, before any step that writes: a commit in the factory's main checkout, the one link-skills.sh links run-slot.sh from, is refused whatever wrapper, shell or cwd made it, behind the no-main-checkout hook; any other clone commits as before
      priority: 1
      run: >-
        case "$(readlink -f "$HOME/.playground/ops/run-slot.sh" 2>/dev/null)" in "$(git rev-parse --show-toplevel)/scripts/ops/run-slot.sh") echo "main-checkout: this is the factory's main checkout; commit in a worktree under .claude/worktrees/ (AGENTS.md, Workflow)" >&2; exit 1;; esac
    conflict-markers:
      # before lint-staged, whose formatter can rewrite a staged conflict marker into Markdown that reads clean
      priority: 2
      run: bun --no-env-file packages/scripts/src/conflict-markers.ts
    skills-manager:
      priority: 2
      glob:
        - "skills/zerostarter/**/*.md"
        - "packages/scripts/src/skills-manager.ts"
      run: bun packages/scripts/src/skills-manager.ts && git add skills/zerostarter/README.md
    lint-staged:
      # --no-stash: lint-staged keeps no backup in the stash list every worktree shares, so no session's pop can take it
      priority: 3
      run: bunx lint-staged --verbose --no-stash
      stage_fixed: true
    agents-rules:
      # the rule test pins each ALWAYS rule by its opening words; its own glob, so a Markdown-only commit still runs it; priority 5, so a broken pin stops the commit before the build and its queue
      priority: 5
      glob:
        - ".agents/dashboard/*.md"
        - "AGENTS.md"
        - "CLAUDE.md"
        - "tests/AGENTS.test.ts"
      run: bun run test:file tests/AGENTS.test.ts
    dashboard-map:
      # the map's drift test, under 60 ms, which turned branches red in CI on 5 Nov while no commit ran it; its glob is what the test reads: the web's pages and the sidebar's imports, the API's routes, the map and its checks
      priority: 5
      glob:
        - "api/hono/src/*"
        - "packages/scripts/src/verify/*"
        - "tests/packages/scripts/src/verify/dashboard-map.test.ts"
        - "web/next/src/*"
      run: bun run test:file tests/packages/scripts/src/verify/dashboard-map.test.ts
    native-title:
      # the no-native-title test, under 60 ms, which turned branches red in CI on 5 Nov while no commit ran it; it scans every file under web/next/src
      priority: 5
      glob:
        - "tests/web/next/src/native-title.test.ts"
        - "web/next/src/*"
      run: bun run test:file tests/web/next/src/native-title.test.ts
    docs-wrap:
      # after lint-staged's formatter, so it reads the docs as they are committed: one sentence per line, none over the limit
      priority: 4
      glob:
        - ".agents/dashboard/*.md"
        - ".agents/skill-trial.md"
        - ".agents/testing.md"
        - "AGENTS.md"
        - "CLAUDE.md"
        - "docs/playground/*.md"
        - "packages/scripts/src/docs-wrap/*.ts"
        - "scripts/README.md"
        - "scripts/hooks/README.md"
        - "extensions/core/skills/playbook/*.md"
        - "web/next/content/docs/dashboard.mdx"
      run: bun --no-env-file packages/scripts/src/docs-wrap/cli.ts --check
    hooks-bundle:
      # a stale guard bundle turns CI red, so a commit touching a bundle's inputs (the guards, the package folders the bundles import, which tests/lefthook.test.ts derives from the bundles, and bun.lock for the packages they inline) checks them first; after lint-staged, whose formatter can rewrite a guard, and skipped in a merge, whose bundles hooks-merge-canary rebuilds in a commit of their own; --check reads the index, what the commit carries, so an unstaged edit to a file's text beside it decides nothing
      priority: 4
      skip:
        - merge
      glob: &bundle-inputs
        - "api/hono/src/lib/dev/proxy.ts"
        - "bun.lock"
        - "packages/config/src/*"
        - "packages/env/src/*"
        - "packages/safe-delete/src/*"
        - "packages/scripts/src/*"
        - "packages/settings/src/*"
        - "scripts/hooks/*.ts"
        - "scripts/hooks/bundled/*"
      run: bun --no-env-file packages/scripts/src/hooks-bundle.ts --check
    trace-count:
      # the trace ratchet's test, as CI runs it: it counts every file git's index holds, as it stands on disk, and a commit of images and fonts alone skips it; then the list kinds from this machine's list, which the test's sandbox hides
      priority: 4
      exclude:
        - "*.gif"
        - "*.ico"
        - "*.jpeg"
        - "*.jpg"
        - "*.png"
        - "*.webp"
        - "*.woff2"
      run: bun run test:file tests/packages/scripts/src/trace-count/count.test.ts && bun --no-env-file packages/scripts/src/trace-count/cli.ts --lists
    text-tests:
      # the two tests that scan the tracked tree's text, as CI runs them, so a commit that breaks one stops here rather than going red in CI; a commit of images and fonts alone skips it
      priority: 4
      exclude:
        - "*.gif"
        - "*.ico"
        - "*.jpeg"
        - "*.jpg"
        - "*.png"
        - "*.webp"
        - "*.woff2"
      run: bun run test:file tests/cmux.test.ts tests/shell-read-redirect.test.ts
    dev-stack:
      # the build below rebuilds packages/* under this checkout's running `bun run dev` and hangs it, so the commit waits for the stack to stop
      priority: 4
      exclude:
        - "*.md"
        - "tests/*.py"
      run: bun --no-env-file api/hono/src/bin/dev-running.ts
    env-keys:
      # before the build, which fails on a short .env one key at a time; this names every key it lacks at once (its own build of @packages/env makes the dist it reads on a fresh worktree)
      priority: 5
      exclude:
        - "*.md"
        - "tests/*.py"
      run: TURBO_CACHE_DIR="${TURBO_CACHE_DIR:-$HOME/.cache/turbo/playground}" bunx turbo run build --filter=@packages/env --output-logs=errors-only && bun packages/scripts/src/env-keys.ts POSTGRES_URL
    build:
      # docs and Python tests feed no build; lefthook skips the step when every staged file matches (its * crosses folders); it stops at once on an unlinked workspace dependency, naming bun install; in a worktree it takes run-slot's commit slot as commit-<worktree>, unless turbo's dry run finds every build task cached; priority 6, so the type checks below run after it
      priority: 6
      exclude:
        - "*.md"
        - "tests/*.py"
      run: TURBO_CACHE_DIR="${TURBO_CACHE_DIR:-$HOME/.cache/turbo/playground}" bun --no-env-file packages/scripts/src/commit-slot.ts bun run build
    check-types-scripts:
      # CI's check-types runs packages/scripts' tsc, which the build does not; at priority 7, after the build, whose dist it reads, and through the commit slot as the build is
      priority: 7
      glob:
        - "packages/scripts/*.ts"
      run: bun --no-env-file packages/scripts/src/commit-slot.ts bun run --cwd packages/scripts check-types
    check-types-tests:
      # CI's check-types:tests, which the build does not run; at priority 7, after the build, whose packages' and @api/hono's dist it reads; it writes web/next's generated data-table metrics first, as CI does, and runs through the commit slot as the build is
      priority: 7
      glob:
        - "tests/*.ts"
      run: bun --no-env-file packages/scripts/src/data-table-metrics.ts && bun --no-env-file packages/scripts/src/commit-slot.ts bun run check-types:tests

commit-msg:
  commands:
    co-authored-by:
      # AGENTS.md's Commits rule: drops the trailer, in any case, and says so, so a commit that carries one goes through on its first try
      priority: 1
      run: bun --no-env-file packages/scripts/src/commit-trailer.ts {1}
    commitlint:
      priority: 2
      run: bunx commitlint --edit {1}
    pg-scope:
      priority: 2
      # a (PG-<n>) scope names the branch's own PG-<n>- item, since a commit made on another item's branch conflicts there later
      run: bun packages/scripts/src/commit-scope.ts {1}

pre-push:
  commands:
    audit:
      # GHSA-vfj7-8cjw-p6xm: braces has no patched release, and only dev tooling (shadcn, globby) reaches it
      run: bun audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm
      only:
        - ref: canary
    ensure-branches:
      run: bun packages/scripts/src/ensure-remote-branches.ts {1}
    hooks-bundle:
      # CI builds a PR on its merge ref, the head merged with canary, so a canary change to a bundle input can stale a head whose own bundles are fresh; a push of a branch that touched a bundle input since it forked from the local origin/canary, a docs-only push included, checks the bundles of the head merged with it, in about a second, so it takes no run slot
      files: git diff --name-only origin/canary...HEAD
      glob: *bundle-inputs
      # lefthook reads files: only for a run that names {files}, so the list goes in a shell comment, quoted so YAML keeps it
      run: "bun --no-env-file packages/scripts/src/hooks-bundle.ts --check --merged origin/canary # {files}"
  # the jobs that read the pushed refs on stdin run from .lefthook/pre-push/, since lefthook skips every pre-push command while the checked-out branch has nothing new against its upstream, and runs a script on every push
  scripts:
    # a pushed commit no remote holds yet whose message holds a Co-authored-by trailer, since a commit made with --no-verify skips commit-msg
    "commit-trailer.sh":
      runner: bash
      use_stdin: true
    # what each pushed ref sends, so a commit made with hooks off is refused before it reaches the remote
    "conflict-markers.sh":
      runner: bash
      use_stdin: true
    # refuses a push whose canary merge dropped a line git merges clean, as pr:merge's keeps canary gate would a review round later
    "keeps-canary.sh":
      runner: bash
      use_stdin: true
